<div class="max-w-7xl mx-auto p-6">
    <div class="flex gap-6">
        <!-- Notification Form Panel -->
        <div class="w-2/3">
            <div class="bg-white rounded-t-lg shadow-lg p-6 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <h1 class="ml-3 text-2xl font-bold text-gray-800">Push Notifications</h1>
                    </div>
                    <span class="px-4 py-2 bg-green-100 text-green-800 rounded-full text-sm font-semibold">Admin</span>
                </div>
            </div>

            <div class="bg-white shadow-lg rounded-b-lg p-6">
                <form [formGroup]="notificationForm" (ngSubmit)="onSubmit()">
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Notification Title</label>
                        <input type="text" formControlName="title" class="w-full px-4 py-2 border text-black border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Enter notification title">
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Message</label>
                        <textarea formControlName="message" class="w-full px-4 py-2 border text-black border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 h-32" placeholder="Enter your notification message"></textarea>
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Target Audience</label>
                        <select formControlName="targetAudience" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500 text-black">
                            <option *ngFor="let option of targetAudienceOptions" [value]="option.value">{{option.label}}</option>
                        </select>
                    </div>

                    <div class="flex justify-end space-x-4">
                        <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-md text-sm font-medium hover:bg-blue-700">
                            Send Notification
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="w-1/3">
            <div class="bg-white rounded-lg shadow-lg p-6 sticky top-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Modification Panel</h2>
                    <span class="text-sm text-gray-500">Latest</span>
                </div>

                <div class="h-[500px] overflow-y-auto">
                    <div class="flex flex-col items-center justify-center h-full text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <p class="text-gray-500 text-lg">No notifications</p>
                        <p class="text-gray-400 text-sm mt-1">You're all caught up!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
