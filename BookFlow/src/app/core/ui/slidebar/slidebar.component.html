<!-- slidebar.component.html -->
<div class="app-container">
  <mat-sidenav-container>
    <mat-sidenav #sidenav mode="side" opened class="sidenav">
      @if (authService.getUserRole()=="COMPANY_SUPERADMIN") {
        <div class="logo-container  mt-4 ml-3">
          <a href="">
            <h1 class="font-bold font-mono text-4xl ">B<span class="text-green-500">OO</span>K<span class="text-red-500">F</span>LOW</h1>
        </a>

        </div>

      }
      <hr class="bg-white">

      <!-- <div class="logo-container">
        <img src="assets/logo.png" alt="Logo" class="logo">
        <h2>Company Name</h2>
      </div> -->
      @if (authService.getUserRole() == "COMPANY_SUPERADMIN") {
      <mat-nav-list>
        <a mat-list-item routerLink="/superadmin/dashboard" routerLinkActive="active"
            [routerLinkActiveOptions]="{exact: true}">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
        </a>
    
        <a mat-list-item routerLink="/superadmin/profile" routerLinkActive="active">
            <mat-icon>person</mat-icon>
            <span>Profile</span>
        </a>
    
        <a mat-list-item routerLink="/superadmin/settings" routerLinkActive="active">
            <mat-icon>settings</mat-icon>
            <span>Settings</span>
        </a>
    
        <a mat-list-item routerLink="/superadmin/users" routerLinkActive="active">
            <mat-icon>supervised_user_circle</mat-icon>
            <span>Users</span>
        </a>
    
        <a mat-list-item routerLink="/superadmin/companies" routerLinkActive="active">
            <mat-icon>work</mat-icon>
            <span>Company</span>
        </a>

        <a mat-list-item routerLink="/superadmin/company" routerLinkActive="active">
          <mat-icon>notifications</mat-icon>
          <span>Notification</span>
        </a>

        <a mat-list-item (click)="authService.logout()">
            <mat-icon>exit_to_app</mat-icon>
            <span>Logout</span>
        </a>
      
    </mat-nav-list>
  }
     
    </mat-sidenav>
    
    <mat-sidenav-content>
      <mat-toolbar>
        <button mat-icon-button (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <span>{{getPageTitle()}}</span>
      </mat-toolbar>

      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
